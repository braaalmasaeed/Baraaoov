name: Build APK

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted_dir
          unzip muezzin_project.zip -d extracted_dir

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Find Project and Build APK
        run: |
          # البحث التلقائي عن المجلد الذي يحتوي على ملف pubspec.yaml
          PROJECT_DIR=$(find extracted_dir -name "pubspec.yaml" -exec dirname {} \;)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muezzin-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'

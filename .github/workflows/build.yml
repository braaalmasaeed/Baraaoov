name: Build CoreLink APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          python3 -c 'from pathlib import Path; import re; m=Path("android/app/src/main/AndroidManifest.xml"); t=m.read_text(encoding="utf-8") if m.exists() else ""; m.write_text(t.replace("</application>", "        <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />\n    </application>", 1), encoding="utf-8") if m.exists() and "flutterEmbedding" not in t and "</application>" in t else None; [k.write_text(f"package {(re.search(r\"^\\s*package\\s+([\\w.]+)\", k.read_text(encoding=\"utf-8\"), re.M).group(1) if re.search(r\"^\\s*package\\s+([\\w.]+)\", k.read_text(encoding=\"utf-8\"), re.M) else \"com.example.core_link\")}\n\nimport io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\n\nclass MainActivity : FlutterActivity() {{\n    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{\n        super.configureFlutterEngine(flutterEngine)\n    }}\n}}\n", encoding="utf-8") for k in Path("android/app/src/main/kotlin").rglob("MainActivity.kt") if "io.flutter.embedding.android.FlutterActivity" not in k.read_text(encoding="utf-8")]'
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk

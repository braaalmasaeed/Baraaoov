name: Build KeyLink APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare KeyLink project (Project Root Discovery)
        run: |
          set -e
          rm -rf extracted_dir keylink_app
          mkdir -p extracted_dir keylink_app

          ZIP_FILE=""
          if [ -f "KeyLink_full.zip" ]; then
            ZIP_FILE="KeyLink_full.zip"
          else
            ZIP_FILE="$(find . -maxdepth 3 -name '*KeyLink*.zip' -type f | head -n 1 || true)"
          fi

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found and extracting archive: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d extracted_dir
          fi

          PROJ_ROOT=""
          if [ -f "extracted_dir/pubspec.yaml" ]; then
            PROJ_ROOT="extracted_dir"
          else
            FOUND_PUBSPEC="$(find extracted_dir -maxdepth 5 -name 'pubspec.yaml' -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_PUBSPEC" ]; then
              PROJ_ROOT="$(dirname "$FOUND_PUBSPEC")"
            elif [ -f "pubspec.yaml" ]; then
              PROJ_ROOT="."
            fi
          fi

          echo "Detected PROJ_ROOT=$PROJ_ROOT"
          if [ -z "$PROJ_ROOT" ] || [ ! -f "$PROJ_ROOT/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found for KeyLink."
            exit 1
          fi

          flutter create keylink_app --org com.baraa.keylink --project-name keylink

          mkdir -p android_res_backup
          if [ -d "keylink_app/android/app/src/main/res" ]; then
            cp -r keylink_app/android/app/src/main/res/. android_res_backup/
          fi

          if [ -d "$PROJ_ROOT/lib" ]; then
            rm -rf keylink_app/lib/*
            cp -r "$PROJ_ROOT/lib"/. keylink_app/lib/
          fi

          if [ -d "$PROJ_ROOT/assets" ]; then
            mkdir -p keylink_app/assets
            cp -r "$PROJ_ROOT/assets"/. keylink_app/assets/
          fi

          cp "$PROJ_ROOT/pubspec.yaml" keylink_app/pubspec.yaml

          if [ -f "$PROJ_ROOT/analysis_options.yaml" ]; then
            cp "$PROJ_ROOT/analysis_options.yaml" keylink_app/analysis_options.yaml
          fi

          if [ -d "$PROJ_ROOT/android/app/src" ]; then
            rm -rf keylink_app/android/app/src
            mkdir -p keylink_app/android/app/src
            cp -r "$PROJ_ROOT/android/app/src"/. keylink_app/android/app/src/
          fi

          mkdir -p keylink_app/android/app/src/main/res
          cp -rn android_res_backup/. keylink_app/android/app/src/main/res/ 2>/dev/null || true

          if [ -f "$PROJ_ROOT/android/app/build.gradle" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle" keylink_app/android/app/build.gradle
          fi

          if [ -f "$PROJ_ROOT/android/app/build.gradle.kts" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle.kts" keylink_app/android/app/build.gradle.kts
          fi

      - name: Build release APK
        working-directory: keylink_app
        run: |
          set -e
          cat <<'PYEOF' > fix_build.py
          import base64
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          res_dir = Path("android/app/src/main/res")
          res_dir.mkdir(parents=True, exist_ok=True)

          has_launcher = any(res_dir.glob("mipmap*/ic_launcher.*"))
          if not has_launcher:
              png_1x1 = base64.b64decode(
                  "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
              )
              for mip in ("mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"):
                  m_dir = res_dir / mip
                  m_dir.mkdir(parents=True, exist_ok=True)
                  (m_dir / "ic_launcher.png").write_bytes(png_1x1)

          styles_path = res_dir / "values" / "styles.xml"
          styles_path.parent.mkdir(parents=True, exist_ok=True)
          need_styles = True
          if styles_path.exists():
              st_txt = styles_path.read_text(encoding="utf-8", errors="ignore")
              if "LaunchTheme" in st_txt and "NormalTheme" in st_txt:
                  need_styles = False
          if need_styles:
              fallback_styles = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">\n'
                  '        <item name="android:windowBackground">?android:colorBackground</item>\n'
                  '    </style>\n'
                  '    <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">\n'
                  '        <item name="android:windowBackground">?android:colorBackground</item>\n'
                  '    </style>\n'
                  '</resources>\n'
              )
              styles_path.write_text(fallback_styles, encoding="utf-8")

          src_dir = Path("android/app/src")
          if src_dir.exists():
              for xml_file in src_dir.rglob("*.xml"):
                  raw = xml_file.read_bytes()
                  if raw.startswith(b"\xef\xbb\xbf"):
                      raw = raw[3:]
                  text = raw.decode("utf-8", errors="ignore")
                  first_lt = text.find("<")
                  if first_lt > 0:
                      text = text[first_lt:]
                  text = text.strip()
                  if xml_file.name == "AndroidManifest.xml":
                      text = re.sub(r'\s+package="[^"]*"', "", text)
                  try:
                      ET.fromstring(text)
                      xml_file.write_text(text + "\n", encoding="utf-8")
                  except Exception:
                      if xml_file.name == "strings.xml":
                          fallback_strings = (
                              '<?xml version="1.0" encoding="utf-8"?>\n'
                              '<resources>\n'
                              '    <string name="app_name">KeyLink</string>\n'
                              '    <string name="accessibility_service_description">KeyLink Accessibility Service for keyboard and mouse mapping.</string>\n'
                              '</resources>\n'
                          )
                          xml_file.write_text(fallback_strings, encoding="utf-8")

          main_strings = res_dir / "values" / "strings.xml"
          main_strings.parent.mkdir(parents=True, exist_ok=True)
          desc_entry = '    <string name="accessibility_service_description">KeyLink Accessibility Service for keyboard and mouse mapping.</string>'
          if main_strings.exists():
              s_txt = main_strings.read_text(encoding="utf-8", errors="ignore")
              if 'name="accessibility_service_description"' not in s_txt and "</resources>" in s_txt:
                  s_txt = s_txt.replace("</resources>", desc_entry + "\n</resources>", 1)
                  main_strings.write_text(s_txt, encoding="utf-8")
          else:
              main_strings.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">KeyLink</string>\n'
                  + desc_entry
                  + "\n</resources>\n",
                  encoding="utf-8",
              )

          for cfg_file in src_dir.rglob("accessibility_service_config.xml"):
              c_txt = cfg_file.read_text(encoding="utf-8", errors="ignore")
              c_txt = re.sub(
                  r'android:accessibilityFlags="[^"]*"',
                  'android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"',
                  c_txt,
              )
              cfg_file.write_text(c_txt, encoding="utf-8")

          kt_root = Path("android/app/src/main/kotlin")
          kt_root.mkdir(parents=True, exist_ok=True)

          # Sanitize any other .kt files (such as OverlayService.kt) for large hex literals
          for kt_file in kt_root.rglob("*.kt"):
              if kt_file.name in ("KeyLinkAccessibilityService.kt", "KeyLinkTileService.kt", "MainActivity.kt"):
                  continue
              raw_kt = kt_file.read_bytes()
              if raw_kt.startswith(b"\xef\xbb\xbf"):
                  raw_kt = raw_kt[3:]
              ktxt = raw_kt.decode("utf-8", errors="ignore")
              ktxt = re.sub(r"\b(0x[89a-fA-F][0-9a-fA-F]{7})\b(?!\s*\.\s*toInt)", r"(\1.toInt())", ktxt)
              kt_file.write_text(ktxt, encoding="utf-8")

          # Detect package directory under kotlin root
          pkg_dir = kt_root / "com" / "baraa" / "keylink"
          existing_main = next(kt_root.rglob("MainActivity.kt"), None)
          if existing_main:
              pkg_dir = existing_main.parent
          pkg_dir.mkdir(parents=True, exist_ok=True)

          acc_kt = pkg_dir / "KeyLinkAccessibilityService.kt"
          acc_kt.write_text(
              """package com.baraa.keylink

import android.accessibilityservice.AccessibilityService
import android.accessibilityservice.GestureDescription
import android.graphics.Path
import android.view.KeyEvent
import android.view.accessibility.AccessibilityEvent

class KeyLinkAccessibilityService : AccessibilityService() {

    override fun onServiceConnected() {
        super.onServiceConnected()
        instance = this
    }

    override fun onDestroy() {
        super.onDestroy()
        if (instance === this) {
            instance = null
        }
    }

    override fun onAccessibilityEvent(event: AccessibilityEvent?) {
        // No-op
    }

    override fun onInterrupt() {
        // No-op
    }

    override fun onKeyEvent(event: KeyEvent?): Boolean {
        if (event == null) return false
        val code = event.keyCode
        if (cancelledKeys.contains(code)) {
            if (event.action == KeyEvent.ACTION_UP) {
                cancelledKeys.remove(code)
            }
            return false
        }
        return false
    }

    fun dispatchTap(x: Float, y: Float) {
        try {
            val path = Path().apply { moveTo(x, y) }
            val stroke = GestureDescription.StrokeDescription(path, 0L, 50L)
            val gesture = GestureDescription.Builder().addStroke(stroke).build()
            dispatchGesture(gesture, null, null)
        } catch (_: Exception) {
        }
    }

    fun dispatchHoldStart(x: Float, y: Float) {
        try {
            val path = Path().apply { moveTo(x, y) }
            val stroke = GestureDescription.StrokeDescription(path, 0L, 500L)
            val gesture = GestureDescription.Builder().addStroke(stroke).build()
            dispatchGesture(gesture, null, null)
        } catch (_: Exception) {
        }
    }

    companion object {
        var instance: KeyLinkAccessibilityService? = null
        val keyMappings: MutableMap<String, Any?> = mutableMapOf()
        val cancelledKeys: MutableSet<Int> = mutableSetOf()

        fun updateKeyMappings(mappings: Any? = null) {
            if (mappings is Map<*, *>) {
                keyMappings.clear()
                for ((k, v) in mappings) {
                    if (k != null) {
                        keyMappings[k.toString()] = v
                    }
                }
            }
        }
    }
}
""",
              encoding="utf-8",
          )

          tile_kt = pkg_dir / "KeyLinkTileService.kt"
          tile_kt.write_text(
              """package com.baraa.keylink

import android.content.Intent
import android.os.Build
import android.service.quicksettings.Tile
import android.service.quicksettings.TileService
import androidx.annotation.RequiresApi

@RequiresApi(Build.VERSION_CODES.N)
class KeyLinkTileService : TileService() {

    override fun onStartListening() {
        super.onStartListening()
        qsTile?.let { tile ->
            tile.state = if (KeyLinkAccessibilityService.instance != null) {
                Tile.STATE_ACTIVE
            } else {
                Tile.STATE_INACTIVE
            }
            tile.updateTile()
        }
    }

    override fun onClick() {
        super.onClick()
        val intent = Intent(this, MainActivity::class.java).apply {
            addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
        }
        try {
            startActivityAndCollapse(intent)
        } catch (_: Exception) {
            startActivity(intent)
        }
    }
}
""",
              encoding="utf-8",
          )

          main_kt = pkg_dir / "MainActivity.kt"
          main_kt.write_text(
              """package com.baraa.keylink

import android.content.Intent
import android.os.Bundle
import android.provider.Settings
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity : FlutterActivity() {
    private val channelName = "com.baraa.keylink/controls"

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
            when (call.method) {
                "isAccessibilityEnabled" -> {
                    result.success(KeyLinkAccessibilityService.instance != null)
                }
                "openAccessibilitySettings" -> {
                    startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                    result.success(true)
                }
                "updateKeyMappings" -> {
                    updateKeyMappings(call.arguments)
                    result.success(true)
                }
                "dispatchTap" -> {
                    val args = call.arguments as? Map<*, *>
                    val x = (args?.get("x") as? Number)?.toFloat() ?: 0f
                    val y = (args?.get("y") as? Number)?.toFloat() ?: 0f
                    KeyLinkAccessibilityService.instance?.dispatchTap(x, y)
                    result.success(true)
                }
                "dispatchHoldStart" -> {
                    val args = call.arguments as? Map<*, *>
                    val x = (args?.get("x") as? Number)?.toFloat() ?: 0f
                    val y = (args?.get("y") as? Number)?.toFloat() ?: 0f
                    KeyLinkAccessibilityService.instance?.dispatchHoldStart(x, y)
                    result.success(true)
                }
                else -> result.notImplemented()
            }
        }
    }

    fun updateKeyMappings(mappings: Any? = null) {
        KeyLinkAccessibilityService.updateKeyMappings(mappings)
    }
}
""",
              encoding="utf-8",
          )

          settings_file = Path("android/settings.gradle")
          if settings_file.exists():
              stxt = settings_file.read_text(encoding="utf-8", errors="ignore")
              mirror_line = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
              if mirror_line not in stxt:
                  stxt = re.sub(r"(mavenCentral\(\))", mirror_line + "\n        " + r"\1", stxt)
                  settings_file.write_text(stxt, encoding="utf-8")

          def extract_constructor_params(screen_file: Path, class_name: str) -> set:
              if not screen_file.exists():
                  return set()
              text = screen_file.read_text(encoding="utf-8", errors="ignore")
              m = re.search(rf"\b{re.escape(class_name)}\s*\(\s*\{{(.*?)\}}\s*(?::|\))", text, re.S)
              if not m:
                  return set()
              body = m.group(1)
              params = {"key"}
              for pm in re.finditer(r"\b(?:this|super)\.([A-Za-z_][A-Za-z0-9_]*)\b", body):
                  params.add(pm.group(1))
              for rm in re.finditer(r"\brequired\s+[A-Za-z0-9_<>, ?]+\s+([A-Za-z_][A-Za-z0-9_]*)\b", body):
                  params.add(rm.group(1))
              return params

          def find_matching_paren(s: str, open_idx: int) -> int:
              depth = 0
              in_str = None
              escape = False
              for idx in range(open_idx, len(s)):
                  ch = s[idx]
                  if in_str:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == in_str:
                          in_str = None
                  else:
                      if ch in ("'", '"'):
                          in_str = ch
                      elif ch == "(":
                          depth += 1
                      elif ch == ")":
                          depth -= 1
                          if depth == 0:
                              return idx
              return -1

          def strip_unsupported_named_args(source: str, class_name: str, allowed_params: set) -> str:
              if not allowed_params:
                  return source
              pattern = re.compile(rf"\b{re.escape(class_name)}\s*\(")
              out = []
              pos = 0
              while True:
                  m = pattern.search(source, pos)
                  if not m:
                      out.append(source[pos:])
                      break
                  open_paren = source.find("(", m.start())
                  close_paren = find_matching_paren(source, open_paren)
                  if close_paren == -1:
                      out.append(source[pos:])
                      break
                  out.append(source[pos:open_paren + 1])
                  inner = source[open_paren + 1:close_paren]

                  args = []
                  start = 0
                  dp = db = dk = 0
                  in_str = None
                  esc = False
                  for idx, ch in enumerate(inner):
                      if in_str:
                          if esc:
                              esc = False
                          elif ch == "\\":
                              esc = True
                          elif ch == in_str:
                              in_str = None
                      else:
                          if ch in ("'", '"'):
                              in_str = ch
                          elif ch == "(":
                              dp += 1
                          elif ch == ")":
                              dp -= 1
                          elif ch == "{":
                              db += 1
                          elif ch == "}":
                              db -= 1
                          elif ch == "[":
                              dk += 1
                          elif ch == "]":
                              dk -= 1
                          elif ch == "," and dp == 0 and db == 0 and dk == 0:
                              args.append(inner[start:idx])
                              start = idx + 1
                  args.append(inner[start:])

                  kept_args = []
                  for arg in args:
                      stripped = arg.strip()
                      if not stripped:
                          continue
                      nm = re.match(r"^\s*([A-Za-z_][A-Za-z0-9_]*)\s*:", stripped)
                      if nm:
                          arg_name = nm.group(1)
                          if arg_name not in allowed_params:
                              continue
                      kept_args.append(arg.strip("\n"))

                  out.append(", ".join(a.strip() for a in kept_args if a.strip()))
                  out.append(")")
                  pos = close_paren + 1
              return "".join(out)

          main_dart = Path("lib/main.dart")
          if main_dart.exists():
              txt = main_dart.read_text(encoding="utf-8", errors="ignore")
              for screen in ("KeyboardSettingsScreen", "MouseSettingsScreen", "PresetsScreen"):
                  txt = re.sub(
                      rf"({screen}\s*\([^)]*?)\bisArabic\s*:\s*_isArabic\b",
                      r"\1language: _isArabic ? 'ar' : 'en'",
                      txt,
                  )
              main_dart.write_text(txt, encoding="utf-8")

          how_to_use = Path("lib/screens/how_to_use_screen.dart")
          if how_to_use.exists():
              htxt = how_to_use.read_text(encoding="utf-8", errors="ignore")
              if "onLanguageChanged" not in htxt:
                  htxt = re.sub(
                      r"(class\s+HowToUseScreen\s+extends\s+StatefulWidget\s*\{)",
                      r"\1\n  final ValueChanged<String>? onLanguageChanged;",
                      htxt,
                  )
                  htxt = re.sub(
                      r"(const\s+HowToUseScreen\s*\(\s*\{[^}]*?)(\}\s*\))",
                      r"\1, this.onLanguageChanged\2",
                      htxt,
                  )
                  how_to_use.write_text(htxt, encoding="utf-8")

          home_dart = Path("lib/screens/home_screen.dart")
          if home_dart.exists():
              hm_txt = home_dart.read_text(encoding="utf-8", errors="ignore")
              hm_txt = re.sub(
                  r"\bHowToUseScreen\s*\(\s*isArabic\s*:\s*(isAr|_isArabic|isArabic)\s*\)",
                  r"HowToUseScreen(language: \1 ? 'ar' : 'en', onLanguageChanged: (_) {})",
                  hm_txt,
              )
              home_dart.write_text(hm_txt, encoding="utf-8")

          screens_dir = Path("lib/screens")
          screen_map = {
              "KeyboardSettingsScreen": screens_dir / "keyboard_settings_screen.dart",
              "MouseSettingsScreen": screens_dir / "mouse_settings_screen.dart",
              "PresetsScreen": screens_dir / "presets_screen.dart",
              "HowToUseScreen": screens_dir / "how_to_use_screen.dart",
          }
          for dart_file in Path("lib").rglob("*.dart"):
              file_txt = dart_file.read_text(encoding="utf-8", errors="ignore")
              new_txt = file_txt
              for cls_name, s_path in screen_map.items():
                  allowed = extract_constructor_params(s_path, cls_name)
                  if allowed:
                      new_txt = strip_unsupported_named_args(new_txt, cls_name, allowed)
              if new_txt != file_txt:
                  dart_file.write_text(new_txt, encoding="utf-8")
          PYEOF

          python3 fix_build.py
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload KeyLink APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keylink-apk
          path: keylink_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

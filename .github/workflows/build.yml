name: Build KeyLink APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Prepare KeyLink Flutter project
        run: |
          set -e
          mkdir -p extracted_dir keylink_app

          if [ -f "KeyLink_full.zip" ]; then
            ZIP_FILE="KeyLink_full.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -name "*KeyLink*.zip" -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)
          fi

          echo "ZIP_FILE=$ZIP_FILE"
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted_dir
          fi

          PROJ_ROOT=""
          if [ -f "extracted_dir/pubspec.yaml" ]; then
            PROJ_ROOT="extracted_dir"
          else
            FOUND_PUBSPEC=$(find extracted_dir -maxdepth 5 -name "pubspec.yaml" -print | head -n 1 || true)
            if [ -n "$FOUND_PUBSPEC" ]; then
              PROJ_ROOT=$(dirname "$FOUND_PUBSPEC")
            elif [ -f "pubspec.yaml" ]; then
              PROJ_ROOT="."
            fi
          fi

          echo "PROJ_ROOT=$PROJ_ROOT"
          if [ -z "$PROJ_ROOT" ] || [ ! -f "$PROJ_ROOT/pubspec.yaml" ]; then
            echo "ERROR: KeyLink pubspec.yaml not found!"
            exit 1
          fi

          flutter create keylink_app --org com.baraa.keylink --project-name keylink

          if [ -d "$PROJ_ROOT/lib" ]; then
            rm -rf keylink_app/lib/*
            cp -r "$PROJ_ROOT/lib"/* keylink_app/lib/
          fi

          if [ -d "$PROJ_ROOT/assets" ]; then
            mkdir -p keylink_app/assets
            cp -r "$PROJ_ROOT/assets"/* keylink_app/assets/
          fi

          cp "$PROJ_ROOT/pubspec.yaml" keylink_app/pubspec.yaml
          if [ -f "$PROJ_ROOT/analysis_options.yaml" ]; then
            cp "$PROJ_ROOT/analysis_options.yaml" keylink_app/analysis_options.yaml
          fi

          if [ -d "$PROJ_ROOT/android/app/src" ]; then
            rm -rf keylink_app/android/app/src
            cp -r "$PROJ_ROOT/android/app/src" keylink_app/android/app/src
          fi
          if [ -f "$PROJ_ROOT/android/app/build.gradle" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle" keylink_app/android/app/build.gradle
          fi
          if [ -f "$PROJ_ROOT/android/app/build.gradle.kts" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle.kts" keylink_app/android/app/build.gradle.kts
          fi

          echo "=== Files in keylink_app/lib ==="
          find keylink_app/lib -type f | sort

      - name: Configure and build release APK
        working-directory: keylink_app
        run: |
          set -e

          if [ ! -d "assets" ] && [ -f "pubspec.yaml" ]; then
            awk '/^[[:space:]]*assets:/{skip=1; next} skip && /^[[:space:]]*-/{next} skip && /^[[:space:]]+[A-Za-z0-9_\/-]+:/{next} skip && /^[[:space:]]*$/{next} {skip=0; print}' pubspec.yaml > pubspec.tmp && mv pubspec.tmp pubspec.yaml
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/compileSdk = [0-9]\+/compileSdk = 35/g' android/app/build.gradle
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          lib_dir = Path("lib")
          screens = {
              "HowToUseScreen": Path("lib/screens/how_to_use_screen.dart"),
              "KeyboardSettingsScreen": Path("lib/screens/keyboard_settings_screen.dart"),
              "MouseSettingsScreen": Path("lib/screens/mouse_settings_screen.dart"),
              "PresetsScreen": Path("lib/screens/presets_screen.dart"),
          }

          candidate_params = [
              "isArabic",
              "language",
              "profile",
              "profiles",
              "onProfileChanged",
              "activeProfile",
              "onSelectProfile",
              "onAddProfile",
          ]

          accepted_by_widget = {}
          for name, path in screens.items():
              accepted = set()
              if path.exists():
                  txt = path.read_text(encoding="utf-8", errors="ignore")
                  ctor_match = re.search(rf"\b{name}\s*\(([\s\S]*?)\)\s*;", txt)
                  ctor_block = ctor_match.group(1) if ctor_match else txt
                  for p in candidate_params:
                      if re.search(rf"\b{re.escape(p)}\b", ctor_block):
                          accepted.add(p)
              accepted_by_widget[name] = accepted

          def split_top_level_args(s: str):
              parts = []
              buf = []
              depth_paren = 0
              depth_bracket = 0
              depth_brace = 0
              in_single = False
              in_double = False
              escape = False
              for ch in s:
                  if escape:
                      buf.append(ch)
                      escape = False
                      continue
                  if ch == "\\":
                      buf.append(ch)
                      escape = True
                      continue
                  if ch == "'" and not in_double:
                      in_single = not in_single
                      buf.append(ch)
                      continue
                  if ch == '"' and not in_single:
                      in_double = not in_double
                      buf.append(ch)
                      continue
                  if in_single or in_double:
                      buf.append(ch)
                      continue
                  if ch == "(":
                      depth_paren += 1
                  elif ch == ")":
                      depth_paren = max(0, depth_paren - 1)
                  elif ch == "[":
                      depth_bracket += 1
                  elif ch == "]":
                      depth_bracket = max(0, depth_bracket - 1)
                  elif ch == "{":
                      depth_brace += 1
                  elif ch == "}":
                      depth_brace = max(0, depth_brace - 1)

                  if ch == "," and depth_paren == 0 and depth_bracket == 0 and depth_brace == 0:
                      parts.append("".join(buf))
                      buf = []
                  else:
                      buf.append(ch)
              if buf:
                  parts.append("".join(buf))
              return parts

          def find_matching_paren(text: str, open_idx: int) -> int:
              depth = 0
              in_single = False
              in_double = False
              escape = False
              for i in range(open_idx, len(text)):
                  ch = text[i]
                  if escape:
                      escape = False
                      continue
                  if ch == "\\":
                      escape = True
                      continue
                  if ch == "'" and not in_double:
                      in_single = not in_single
                      continue
                  if ch == '"' and not in_single:
                      in_double = not in_double
                      continue
                  if in_single or in_double:
                      continue
                  if ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          for dart_file in lib_dir.rglob("*.dart"):
              content = dart_file.read_text(encoding="utf-8", errors="ignore")
              changed = False
              for widget_name, accepted in accepted_by_widget.items():
                  disallowed = [p for p in candidate_params if p not in accepted]
                  if not disallowed:
                      continue
                  pattern = re.compile(rf"\b{widget_name}\s*\(")
                  pos = 0
                  out = []
                  while True:
                      m = pattern.search(content, pos)
                      if not m:
                          out.append(content[pos:])
                          break
                      open_paren = m.end() - 1
                      close_paren = find_matching_paren(content, open_paren)
                      if close_paren == -1:
                          out.append(content[pos:])
                          break
                      inner = content[open_paren + 1 : close_paren]
                      raw_args = split_top_level_args(inner)
                      kept = []
                      for arg in raw_args:
                          stripped = arg.strip()
                          if not stripped:
                              continue
                          kw_match = re.match(r"^([A-Za-z_][A-Za-z0-9_]*)\s*:", stripped)
                          if kw_match and kw_match.group(1) in disallowed:
                              changed = True
                              continue
                          kept.append(arg)
                      out.append(content[pos : open_paren + 1])
                      out.append(",".join(kept))
                      out.append(content[close_paren : close_paren + 1])
                      pos = close_paren + 1
                  content = "".join(out)
              if changed:
                  dart_file.write_text(content, encoding="utf-8")
          PY

          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: keylink-apk
          path: keylink_app/build/app/outputs/flutter-apk/app-release.apk

name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix embedding and build APK
        run: |
          set -e
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          python3 - <<'EOF'
from pathlib import Path
import re

for manifest in Path("android/app/src").rglob("AndroidManifest.xml"):
    txt = manifest.read_text(encoding="utf-8", errors="ignore")
    txt = re.sub(
        r'(<meta-data\b[^>]*android:name=["\']flutterEmbedding["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',
        r'\g<1>2\g<2>',
        txt,
        flags=re.S
    )
    txt = re.sub(
        r'(<meta-data\b[^>]*android:value=["\'])[^"\']*([^>]*android:name=["\']flutterEmbedding["\'][^>]*/?>)',
        r'\g<1>2\g<2>',
        txt,
        flags=re.S
    )
    if "flutterEmbedding" not in txt and "</application>" in txt:
        meta = '        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />\n'
        txt = txt.replace("</application>", meta + "    </application>", 1)
    manifest.write_text(txt, encoding="utf-8")

for kt in Path("android/app/src").rglob("MainActivity.kt"):
    code = kt.read_text(encoding="utf-8", errors="ignore")
    if "io.flutter.app." in code or "io.flutter.embedding.android.FlutterActivity" not in code:
        m = re.search(r'^\s*package\s+([A-Za-z0-9_.]+)', code, re.M)
        pkg = m.group(1) if m else "com.example.core_link"
        kt.write_text(
            f'package {pkg}\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n',
            encoding="utf-8"
        )
EOF

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk
 

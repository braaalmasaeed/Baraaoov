name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
      - run: |
          mkdir -p extracted_dir flutter_app
          if [ -f "muezzin_project.zip" ]; then
            unzip -o muezzin_project.zip -d extracted_dir
          fi
          flutter create flutter_app --org com.braa.muezzin --project-name muezzin
          LIB_SOURCE=$(find . -maxdepth 4 -path "./flutter_app" -prune -o -type d -name "lib" -print | head -n 1)
          echo "Found lib at: $LIB_SOURCE"
          if [ -n "$LIB_SOURCE" ]; then
            cp -r "$LIB_SOURCE"/* flutter_app/lib/
          fi
          PUBSPEC_SOURCE=$(find . -maxdepth 4 -path "./flutter_app" -prune -o -type f -name "pubspec.yaml" -print | head -n 1)
          echo "Found pubspec at: $PUBSPEC_SOURCE"
          if [ -n "$PUBSPEC_SOURCE" ]; then
            cp "$PUBSPEC_SOURCE" flutter_app/pubspec.yaml
          fi
          cd flutter_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: muezzin-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

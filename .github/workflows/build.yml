name: Build KeyLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare KeyLink project
        shell: bash
        run: |
          set -e
          if [ -f "KeyLink_full.zip" ]; then
            echo "Extracting KeyLink_full.zip..."
            unzip -o "KeyLink_full.zip" -d .
          fi

          if [ ! -f "pubspec.yaml" ]; then
            FOUND_PUBSPEC=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | head -n 1 || true)
            if [ -n "$FOUND_PUBSPEC" ]; then
              PROJECT_DIR=$(dirname "$FOUND_PUBSPEC")
              echo "Moving project files from $PROJECT_DIR to repository root..."
              cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
            fi
          fi

          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keylink-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

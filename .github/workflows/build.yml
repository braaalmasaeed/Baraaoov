name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix embedding and build APK
        run: |
          set -e
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          for manifest in $(find android/app/src -name "AndroidManifest.xml" 2>/dev/null); do
            sed -i 's/android:value="1"/android:value="2"/g; s/android:value=\x271\x27/android:value=\x272\x27/g' "$manifest"
            if ! grep -q "flutterEmbedding" "$manifest"; then
              sed -i 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$manifest"
            fi
          done

          for kt in $(find android/app/src -name "MainActivity.kt" 2>/dev/null); do
            if grep -q "io\.flutter\.app\." "$kt" || ! grep -q "io\.flutter\.embedding\.android\.FlutterActivity" "$kt"; then
              PKG=$(grep -E '^[[:space:]]*package[[:space:]]+' "$kt" | head -n 1 | sed -E 's/^[[:space:]]*package[[:space:]]+([^ ;/]+).*/\1/')
              [ -z "$PKG" ] && PKG="com.example.core_link"
              printf 'package %s\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n' "$PKG" > "$kt"
            fi
          done

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk
 

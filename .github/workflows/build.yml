name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Android v2 files and build APK
        run: |
          set -e
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          rm -rf /tmp/corelink_backup
          mkdir -p /tmp/corelink_backup/lib /tmp/corelink_backup/kotlin
          [ -d "lib" ] && cp -r lib/* /tmp/corelink_backup/lib/ 2>/dev/null || true
          [ -d "android/app/src/main/kotlin" ] && cp -r android/app/src/main/kotlin/* /tmp/corelink_backup/kotlin/ 2>/dev/null || true
          flutter create --platforms=android .
          mkdir -p lib android/app/src/main/kotlin
          cp -r /tmp/corelink_backup/lib/* lib/ 2>/dev/null || true
          cp -rn /tmp/corelink_backup/kotlin/* android/app/src/main/kotlin/ 2>/dev/null || true
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PKG_NAME=$(grep -oE 'package="[^"]+"' "$MANIFEST" | head -n 1 | sed -E 's/package="([^"]+)"/\1/')
            sed -i -E 's/[[:space:]]*package="[^"]*"//g' "$MANIFEST"
            sed -i -E 's/[[:space:]]*android:roundIcon="[^"]*"//g' "$MANIFEST"
            if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
              sed -i 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$MANIFEST"
            fi
            if [ -n "$PKG_NAME" ]; then
              for gradle_file in android/app/build.gradle android/app/build.gradle.kts; do
                if [ -f "$gradle_file" ]; then
                  sed -i -E "s/namespace[[:space:]]*=[[:space:]]*\"[^\"]+\"/namespace = \"$PKG_NAME\"/g; s/namespace[[:space:]]+'[^']+'/namespace '$PKG_NAME'/g" "$gradle_file"
                fi
              done
            fi
          fi
          echo "" | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk

name: Build KeyLink APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Prepare KeyLink project
        run: |
          set -e
          mkdir -p extracted_dir keylink_app
          ZIP_FILE="KeyLink_full.zip"
          [ -f "$ZIP_FILE" ] || ZIP_FILE=$(find . -maxdepth 3 -name "*KeyLink*.zip" | head -n 1 || true)
          [ -n "$ZIP_FILE" ] && unzip -o "$ZIP_FILE" -d extracted_dir

          PROJ_ROOT="extracted_dir"
          [ -f "extracted_dir/pubspec.yaml" ] || PROJ_ROOT=$(dirname "$(find extracted_dir -maxdepth 5 -name pubspec.yaml | head -n 1)")
          [ -f "$PROJ_ROOT/pubspec.yaml" ]

          flutter create keylink_app --org com.baraa.keylink --project-name keylink
          [ -d "$PROJ_ROOT/lib" ] && rm -rf keylink_app/lib/* && cp -r "$PROJ_ROOT/lib"/* keylink_app/lib/
          [ -d "$PROJ_ROOT/assets" ] && mkdir -p keylink_app/assets && cp -r "$PROJ_ROOT/assets"/* keylink_app/assets/
          cp "$PROJ_ROOT/pubspec.yaml" keylink_app/pubspec.yaml
          [ -f "$PROJ_ROOT/analysis_options.yaml" ] && cp "$PROJ_ROOT/analysis_options.yaml" keylink_app/analysis_options.yaml
          [ -d "$PROJ_ROOT/android/app/src" ] && rm -rf keylink_app/android/app/src && cp -r "$PROJ_ROOT/android/app/src" keylink_app/android/app/src
          [ -f "$PROJ_ROOT/android/app/build.gradle" ] && cp "$PROJ_ROOT/android/app/build.gradle" keylink_app/android/app/build.gradle
          [ -f "$PROJ_ROOT/android/app/build.gradle.kts" ] && cp "$PROJ_ROOT/android/app/build.gradle.kts" keylink_app/android/app/build.gradle.kts

      - name: Build APK
        working-directory: keylink_app
        run: |
          set -e
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: keylink-apk
          path: keylink_app/build/app/outputs/flutter-apk/app-release.apk
 

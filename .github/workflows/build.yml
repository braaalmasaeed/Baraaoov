name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
      - run: |
          mkdir -p extracted_dir flutter_app
          unzip -o muezzin_project.zip -d extracted_dir
          flutter create flutter_app --org com.braa.muezzin --project-name muezzin
          LIB_SOURCE=$(find extracted_dir -type d -name "lib" | head -n 1)
          echo "Found lib at: $LIB_SOURCE"
          if [ -n "$LIB_SOURCE" ]; then
            cp -r "$LIB_SOURCE"/* flutter_app/lib/
          fi
          cat << 'EOF' > flutter_app/lib/main.dart
import 'package:flutter/material.dart';
import 'screens/home_screen.dart';

void main() {
  WidgetsFlutterBinding.ensureInitialized();
  runApp(const MuezzinApp());
}

class MuezzinApp extends StatelessWidget {
  const MuezzinApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Muezzin',
      theme: ThemeData.dark(),
      home: const HomeScreen(),
    );
  }
}
EOF
          cd flutter_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: muezzin-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

name: Build KeyLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare KeyLink project and enforce Android v2 embedding
        shell: bash
        run: |
          set -e
          if [ -f "KeyLink_full.zip" ]; then
            echo "Extracting KeyLink_full.zip..."
            unzip -o "KeyLink_full.zip" -d .
          fi

          if [ ! -f "pubspec.yaml" ]; then
            FOUND_PUBSPEC=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | head -n 1 || true)
            if [ -n "$FOUND_PUBSPEC" ]; then
              PROJECT_DIR=$(dirname "$FOUND_PUBSPEC")
              echo "Moving project files from $PROJECT_DIR to repository root..."
              cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
            fi
          fi

          python3 - << 'EOF'
          import os, re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()

              content = re.sub(
                  r'(<meta-data\s+android:name="flutterEmbedding"\s+android:value=")1("\s*/?>)',
                  r'\g<1>2\2',
                  content,
              )

              if 'android:name="flutterEmbedding"' not in content:
                  meta_tag = '        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />\n'
                  if "</application>" in content:
                      content = content.replace("</application>", meta_tag + "    </application>", 1)

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Updated AndroidManifest.xml with flutterEmbedding=2")

          for root, _, files in os.walk("android/app/src/main"):
              for fn in files:
                  if fn.endswith((".kt", ".java")):
                      p = os.path.join(root, fn)
                      with open(p, "r", encoding="utf-8") as f:
                          src = f.read()
                      updated = src.replace("io.flutter.app.FlutterActivity", "io.flutter.embedding.android.FlutterActivity")
                      if updated != src:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(updated)
                          print("Updated v1 activity import in:", p)
          EOF

          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keylink-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

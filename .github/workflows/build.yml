name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Android v2 files and build APK
        run: |
          set -e
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          mkdir -p /tmp/kotlin_backup
          if [ -d "android/app/src/main/kotlin" ]; then
            cp -r android/app/src/main/kotlin/* /tmp/kotlin_backup/ 2>/dev/null || true
          fi

          flutter create --platforms=android .

          if [ -d "/tmp/kotlin_backup" ]; then
            mkdir -p android/app/src/main/kotlin
            cp -rn /tmp/kotlin_backup/* android/app/src/main/kotlin/ 2>/dev/null || true
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PKG_NAME=$(grep -oE 'package="[^"]+"' "$MANIFEST" | head -n 1 | sed -E 's/package="([^"]+)"/\1/')
            sed -i -E 's/[[:space:]]*package="[^"]*"//g' "$MANIFEST"
            if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
              sed -i 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$MANIFEST"
            fi
            if [ -n "$PKG_NAME" ]; then
              for gradle_file in android/app/build.gradle android/app/build.gradle.kts; do
                if [ -f "$gradle_file" ]; then
                  sed -i -E "s/namespace[[:space:]]*=[[:space:]]*\"[^\"]+\"/namespace = \"$PKG_NAME\"/g; s/namespace[[:space:]]+'[^']+'/namespace '$PKG_NAME'/g" "$gradle_file"
                fi
              done
            fi
          fi

          if [ -f "lib/main.dart" ]; then
            sed -i 's/Icons\.settings_input_mouse/Icons.mouse/g' "lib/main.dart"
            sed -i -E '/ListTile\s*\(/,/\)\s*,?/{s/\bonPressed\s*:/onTap:/g}' "lib/main.dart"
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk

name: Build APK

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip muezzin_project.zip -d extracted_dir

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Build APK
        run: |
          cd extracted_dir
          cd $(ls -d */ | head -n 1)
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muezzin-apk
          path: extracted_dir/**/build/app/outputs/flutter-apk/app-release.apk

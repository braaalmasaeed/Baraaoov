name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix embedding and build APK
        run: |
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:value="1"/android:value="2"/g' "$MANIFEST"
            if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
              sed -i 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|g' "$MANIFEST"
            fi
          fi
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk
 

name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix embedding and build APK
        run: |
          set -e
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          cat <<'EOF' > fix_v2.py
          from pathlib import Path

          for manifest in Path("android/app/src").rglob("AndroidManifest.xml"):
              txt = manifest.read_text(encoding="utf-8", errors="ignore")
              txt = txt.replace('android:value="1"', 'android:value="2"').replace("android:value='1'", "android:value='2'")
              if "flutterEmbedding" not in txt and "</application>" in txt:
                  meta = '        <meta-data android:name="flutterEmbedding" android:value="2" />\n'
                  txt = txt.replace("</application>", meta + "    </application>", 1)
              manifest.write_text(txt, encoding="utf-8")

          for kt in Path("android/app/src").rglob("MainActivity.kt"):
              code = kt.read_text(encoding="utf-8", errors="ignore")
              if "io.flutter.app." in code or "io.flutter.embedding.android.FlutterActivity" not in code:
                  pkg = "com.example.core_link"
                  for line in code.splitlines():
                      s = line.strip()
                      if s.startswith("package "):
                          pkg = s.replace("package ", "", 1).split(";")[0].strip()
                          break
                  kt.write_text(
                      "package " + pkg + "\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n",
                      encoding="utf-8"
                  )
          EOF

          sed -i 's/^          //' fix_v2.py
          python3 fix_v2.py
          rm -f fix_v2.py

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk

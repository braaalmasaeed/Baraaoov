name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src || echo "[ERROR] Failed to unzip CoreLink.zip — skipped and continuing"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix errors with markers, continue all steps, and report
        run: |
          set +e
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; 2>/dev/null | head -n 1)
          echo "Project directory: ${PROJECT_DIR:-NOT_FOUND}"
          if [ -z "$PROJECT_DIR" ]; then
            echo "[ERROR] pubspec.yaml not found — skipped and continuing"
            echo "FINAL RESULT: ERRORS FOUND (THE REST OF THE STEPS COMPLETED)"
            exit 0
          fi
          cd "$PROJECT_DIR"

          REPORT="/tmp/corelink_error_markers.log"
          : > "$REPORT"

          rm -rf /tmp/corelink_backup
          mkdir -p /tmp/corelink_backup/lib /tmp/corelink_backup/kotlin
          cp -r lib/* /tmp/corelink_backup/lib/ 2>/dev/null || echo "[ERROR] lib backup warning — skipped and continuing" >> "$REPORT"
          cp -r android/app/src/main/kotlin/* /tmp/corelink_backup/kotlin/ 2>/dev/null || true
          echo "[OK] Backed up lib and kotlin files"

          flutter create --platforms=android . >/tmp/create.log 2>&1
          if [ $? -eq 0 ]; then
            echo "[OK] Regenerated Android v2 files"
          else
            echo "[ERROR] flutter create failed — skipped and continuing"
            echo "[ERROR] android/ | flutter create failed" >> "$REPORT"
          fi

          mkdir -p lib android/app/src/main/kotlin
          cp -r /tmp/corelink_backup/lib/* lib/ 2>/dev/null || echo "[ERROR] lib restore warning — skipped and continuing" >> "$REPORT"
          cp -rn /tmp/corelink_backup/kotlin/* android/app/src/main/kotlin/ 2>/dev/null || true
          echo "[OK] Restored lib and kotlin files"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PKG_NAME=$(grep -oE 'package="[^"]+"' "$MANIFEST" 2>/dev/null | head -n 1 | sed -E 's/package="([^"]+)"/\1/')
            sed -i -E 's/[[:space:]]*package="[^"]*"//g' "$MANIFEST" 2>/dev/null || echo "[ERROR] $MANIFEST | failed removing package — skipped and continuing" >> "$REPORT"
            sed -i -E 's/[[:space:]]*android:roundIcon="[^"]*"//g' "$MANIFEST" 2>/dev/null || echo "[ERROR] $MANIFEST | failed removing roundIcon — skipped and continuing" >> "$REPORT"
            if ! grep -q 'flutterEmbedding' "$MANIFEST" 2>/dev/null; then
              sed -i 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$MANIFEST" 2>/dev/null || echo "[ERROR] $MANIFEST | failed adding flutterEmbedding — skipped and continuing" >> "$REPORT"
            fi
            if [ -n "$PKG_NAME" ]; then
              for gradle_file in android/app/build.gradle android/app/build.gradle.kts; do
                if [ -f "$gradle_file" ]; then
                  sed -i -E "s/namespace[[:space:]]*=[[:space:]]*\"[^\"]+\"/namespace = \"$PKG_NAME\"/g; s/namespace[[:space:]]+'[^']+'/namespace '$PKG_NAME'/g" "$gradle_file" 2>/dev/null || echo "[ERROR] $gradle_file | failed updating namespace — skipped and continuing" >> "$REPORT"
                fi
              done
            fi
            echo "[OK] Updated AndroidManifest.xml and Gradle namespace"
          else
            echo "[ERROR] AndroidManifest.xml missing — skipped and continuing"
            echo "[ERROR] android/app/src/main/AndroidManifest.xml | Missing file" >> "$REPORT"
          fi

          if [ -f "lib/main.dart" ]; then
            sed -i 's/Icons\.settings_input_mouse/Icons.mouse/g' "lib/main.dart" 2>/dev/null || true
            sed -i -E 's/([[:space:]]*)onPressed([[:space:]]*:)/\1onTap\2/g' "lib/main.dart" 2>/dev/null || echo "[ERROR] lib/main.dart | failed replacing onPressed inside widgets — skipped and continuing" >> "$REPORT"
            echo "[OK] Applied Dart fixes to lib/main.dart"
          fi

          flutter pub get >/tmp/pubget.log 2>&1
          if [ $? -eq 0 ]; then
            echo "[OK] flutter pub get succeeded"
          else
            echo "[ERROR] flutter pub get failed — skipped and continuing"
            echo "[ERROR] pubspec.yaml | flutter pub get failed" >> "$REPORT"
          fi

          flutter analyze --no-pub >/tmp/analyze.log 2>&1
          ANALYZE_EXIT=$?
          while IFS= read -r line; do
            case "$line" in
              *"error •"*)
                echo "[ERROR] $line — skipped and continuing"
                echo "[ERROR] $line" >> "$REPORT"
                ;;
              *)
                echo "$line"
                ;;
            esac
          done < /tmp/analyze.log

          BUILD_OUT="/tmp/flutter_build.log"
          flutter build apk --release >"$BUILD_OUT" 2>&1
          BUILD_EXIT=$?
          while IFS= read -r line; do
            if echo "$line" | grep -qE "(Error:|error:|FAILURE:|Exception:|AAPT:|Execution failed for task)"; then
              echo "[ERROR] $line — skipped and continuing"
              echo "[ERROR] $line" >> "$REPORT"
            else
              echo "$line"
            fi
          done < "$BUILD_OUT"

          echo ""
          echo "=========================================================="
          if [ -s "$REPORT" ] || [ "$ANALYZE_EXIT" -ne 0 ] || [ "$BUILD_EXIT" -ne 0 ]; then
            echo "FINAL RESULT: ERRORS FOUND (MARKED WITH [ERROR]), AND THE REST OF THE STEPS COMPLETED"
            echo "=========================================================="
            echo "MARKED ERRORS & LOCATIONS:"
            if [ -s "$REPORT" ]; then
              cat "$REPORT"
            else
              echo "[ERROR] Check marked lines above."
            fi
          else
            echo "FINAL RESULT: ALL STEPS SUCCEEDED WITH ZERO ERRORS"
          fi
          echo "=========================================================="
          exit 0

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk
 

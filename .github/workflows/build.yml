name: Build KeyLink APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare KeyLink project (Project Root Discovery)
        run: |
          set -e
          rm -rf extracted_dir keylink_app
          mkdir -p extracted_dir keylink_app

          ZIP_FILE=""
          if [ -f "KeyLink_full.zip" ]; then
            ZIP_FILE="KeyLink_full.zip"
          else
            ZIP_FILE="$(find . -maxdepth 3 -name '*KeyLink*.zip' -type f | head -n 1 || true)"
          fi

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found and extracting archive: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d extracted_dir
          fi

          PROJ_ROOT=""
          if [ -f "extracted_dir/pubspec.yaml" ]; then
            PROJ_ROOT="extracted_dir"
          else
            FOUND_PUBSPEC="$(find extracted_dir -maxdepth 5 -name 'pubspec.yaml' -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_PUBSPEC" ]; then
              PROJ_ROOT="$(dirname "$FOUND_PUBSPEC")"
            elif [ -f "pubspec.yaml" ]; then
              PROJ_ROOT="."
            fi
          fi

          echo "Detected PROJ_ROOT=$PROJ_ROOT"
          if [ -z "$PROJ_ROOT" ] || [ ! -f "$PROJ_ROOT/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found for KeyLink."
            exit 1
          fi

          flutter create keylink_app --org com.baraa.keylink --project-name keylink

          if [ -d "$PROJ_ROOT/lib" ]; then
            rm -rf keylink_app/lib/*
            cp -r "$PROJ_ROOT/lib"/. keylink_app/lib/
          fi

          if [ -d "$PROJ_ROOT/assets" ]; then
            mkdir -p keylink_app/assets
            cp -r "$PROJ_ROOT/assets"/. keylink_app/assets/
          fi

          cp "$PROJ_ROOT/pubspec.yaml" keylink_app/pubspec.yaml

          if [ -f "$PROJ_ROOT/analysis_options.yaml" ]; then
            cp "$PROJ_ROOT/analysis_options.yaml" keylink_app/analysis_options.yaml
          fi

          if [ -d "$PROJ_ROOT/android/app/src" ]; then
            rm -rf keylink_app/android/app/src
            mkdir -p keylink_app/android/app/src
            cp -r "$PROJ_ROOT/android/app/src"/. keylink_app/android/app/src/
          fi

          if [ -f "$PROJ_ROOT/android/app/build.gradle" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle" keylink_app/android/app/build.gradle
          fi

          if [ -f "$PROJ_ROOT/android/app/build.gradle.kts" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle.kts" keylink_app/android/app/build.gradle.kts
          fi

          echo "=== Verified keylink_app/lib files ==="
          find keylink_app/lib -type f | sort
          echo "=== Verified keylink_app/android/app/src files ==="
          find keylink_app/android/app/src -type f 2>/dev/null | sort || true

      - name: Build release APK
        working-directory: keylink_app
        run: |
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Add Maven Central mirror inside android/settings.gradle compatible with PREFER_SETTINGS
          settings_file = Path("android/settings.gradle")
          if settings_file.exists():
              stxt = settings_file.read_text(encoding="utf-8", errors="ignore")
              mirror_line = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
              if mirror_line not in stxt:
                  stxt = re.sub(
                      r"(mavenCentral\(\))",
                      rf"{mirror_line}\n        \1",
                      stxt,
                  )
                  settings_file.write_text(stxt, encoding="utf-8")

          def extract_constructor_params(screen_file: Path, class_name: str) -> set[str]:
              if not screen_file.exists():
                  return set()
              text = screen_file.read_text(encoding="utf-8", errors="ignore")
              m = re.search(rf"\b{re.escape(class_name)}\s*\(\s*\{{(.*?)\}}\s*(?::|\))", text, re.S)
              if not m:
                  return set()
              body = m.group(1)
              params = {"key"}
              for pm in re.finditer(r"\b(?:this|super)\.([A-Za-z_][A-Za-z0-9_]*)\b", body):
                  params.add(pm.group(1))
              for rm in re.finditer(r"\brequired\s+[A-Za-z0-9_<>, ?]+\s+([A-Za-z_][A-Za-z0-9_]*)\b", body):
                  params.add(rm.group(1))
              return params

          def find_matching_paren(s: str, open_idx: int) -> int:
              depth = 0
              in_str = None
              escape = False
              for idx in range(open_idx, len(s)):
                  ch = s[idx]
                  if in_str:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == in_str:
                          in_str = None
                  else:
                      if ch in ("'", '"'):
                          in_str = ch
                      elif ch == "(":
                          depth += 1
                      elif ch == ")":
                          depth -= 1
                          if depth == 0:
                              return idx
              return -1

          def strip_unsupported_named_args(source: str, class_name: str, allowed_params: set[str]) -> str:
              if not allowed_params:
                  return source
              pattern = re.compile(rf"\b{re.escape(class_name)}\s*\(")
              out = []
              pos = 0
              while True:
                  m = pattern.search(source, pos)
                  if not m:
                      out.append(source[pos:])
                      break
                  open_paren = source.find("(", m.start())
                  close_paren = find_matching_paren(source, open_paren)
                  if close_paren == -1:
                      out.append(source[pos:])
                      break
                  out.append(source[pos:open_paren + 1])
                  inner = source[open_paren + 1:close_paren]

                  args = []
                  start = 0
                  dp = db = dk = 0
                  in_str = None
                  esc = False
                  for idx, ch in enumerate(inner):
                      if in_str:
                          if esc:
                              esc = False
                          elif ch == "\\":
                              esc = True
                          elif ch == in_str:
                              in_str = None
                      else:
                          if ch in ("'", '"'):
                              in_str = ch
                          elif ch == "(":
                              dp += 1
                          elif ch == ")":
                              dp -= 1
                          elif ch == "{":
                              db += 1
                          elif ch == "}":
                              db -= 1
                          elif ch == "[":
                              dk += 1
                          elif ch == "]":
                              dk -= 1
                          elif ch == "," and dp == 0 and db == 0 and dk == 0:
                              args.append(inner[start:idx])
                              start = idx + 1
                  args.append(inner[start:])

                  kept_args = []
                  for arg in args:
                      stripped = arg.strip()
                      if not stripped:
                          continue
                      nm = re.match(r"^\s*([A-Za-z_][A-Za-z0-9_]*)\s*:", stripped)
                      if nm:
                          arg_name = nm.group(1)
                          if arg_name not in allowed_params:
                              print(f"Stripped unsupported arg '{arg_name}' from {class_name}")
                              continue
                      kept_args.append(arg.strip("\n"))

                  out.append(", ".join(a.strip() for a in kept_args if a.strip()))
                  out.append(")")
                  pos = close_paren + 1
              return "".join(out)

          main_dart = Path("lib/main.dart")
          if main_dart.exists():
              txt = main_dart.read_text(encoding="utf-8", errors="ignore")
              for screen in ("KeyboardSettingsScreen", "MouseSettingsScreen", "PresetsScreen"):
                  txt = re.sub(
                      rf"({screen}\s*\([^)]*?)\bisArabic\s*:\s*_isArabic\b",
                      r"\1language: _isArabic ? 'ar' : 'en'",
                      txt,
                  )
              main_dart.write_text(txt, encoding="utf-8")

          how_to_use = Path("lib/screens/how_to_use_screen.dart")
          if how_to_use.exists():
              htxt = how_to_use.read_text(encoding="utf-8", errors="ignore")
              if "onLanguageChanged" not in htxt:
                  htxt = re.sub(
                      r"(class\s+HowToUseScreen\s+extends\s+StatefulWidget\s*\{)",
                      r"\1\n  final ValueChanged<String>? onLanguageChanged;",
                      htxt,
                  )
                  htxt = re.sub(
                      r"(const\s+HowToUseScreen\s*\(\s*\{[^}]*?)(\}\s*\))",
                      r"\1, this.onLanguageChanged\2",
                      htxt,
                  )
                  how_to_use.write_text(htxt, encoding="utf-8")

          home_dart = Path("lib/screens/home_screen.dart")
          if home_dart.exists():
              hm_txt = home_dart.read_text(encoding="utf-8", errors="ignore")
              hm_txt = re.sub(
                  r"\bHowToUseScreen\s*\(\s*isArabic\s*:\s*(isAr|_isArabic|isArabic)\s*\)",
                  r"HowToUseScreen(language: \1 ? 'ar' : 'en', onLanguageChanged: (_) {})",
                  hm_txt,
              )
              home_dart.write_text(hm_txt, encoding="utf-8")

          screens_dir = Path("lib/screens")
          screen_map = {
              "KeyboardSettingsScreen": screens_dir / "keyboard_settings_screen.dart",
              "MouseSettingsScreen": screens_dir / "mouse_settings_screen.dart",
              "PresetsScreen": screens_dir / "presets_screen.dart",
              "HowToUseScreen": screens_dir / "how_to_use_screen.dart",
          }
          for dart_file in Path("lib").rglob("*.dart"):
              file_txt = dart_file.read_text(encoding="utf-8", errors="ignore")
              new_txt = file_txt
              for cls_name, s_path in screen_map.items():
                  allowed = extract_constructor_params(s_path, cls_name)
                  if allowed:
                      new_txt = strip_unsupported_named_args(new_txt, cls_name, allowed)
              if new_txt != file_txt:
                  dart_file.write_text(new_txt, encoding="utf-8")
          PY

          flutter pub get

          for attempt in 1 2 3; do
            echo "Building release APK (attempt $attempt/3)..."
            if flutter build apk --release; then
              echo "APK build succeeded!"
              exit 0
            fi
            echo "Build attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done
          exit 1

      - name: Upload KeyLink APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keylink-apk
          path: keylink_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

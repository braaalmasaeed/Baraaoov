name: Build APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted_dir
          unzip -o muezzin_project.zip -d extracted_dir

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Prepare Flutter Project Structure
        run: |
          mkdir -p flutter_app
          flutter create flutter_app --org com.braa.muezzin --project-name muezzin
          if [ -d "extracted_dir/lib" ]; then
            cp -r extracted_dir/lib/* flutter_app/lib/
          fi
          if [ ! -f "flutter_app/lib/main.dart" ]; then
            cat << 'EOF' > flutter_app/lib/main.dart
import 'package:flutter/material.dart';
import 'screens/home_screen.dart';

void main() {
  WidgetsFlutterBinding.ensureInitialized();
  runApp(const MuezzinApp());
}

class MuezzinApp extends StatelessWidget {
  const MuezzinApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Muezzin',
      theme: ThemeData.dark(),
      home: const HomeScreen(),
    );
  }
}
EOF
          fi

      - name: Build APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muezzin-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

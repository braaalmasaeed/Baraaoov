name: Build KeyLink APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle Maven Central mirror fallback (avoid HTTP 429)
        run: |
          mkdir -p ~/.gradle/init.d
          cat <<'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                      google()
                      mavenCentral()
                  }
              }
              repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Prepare KeyLink project (Project Root Discovery)
        run: |
          set -e
          rm -rf extracted_dir keylink_app
          mkdir -p extracted_dir keylink_app

          ZIP_FILE=""
          if [ -f "KeyLink_full.zip" ]; then
            ZIP_FILE="KeyLink_full.zip"
          else
            ZIP_FILE="$(find . -maxdepth 3 -name '*KeyLink*.zip' -type f | head -n 1 || true)"
          fi

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found and extracting archive: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d extracted_dir
          fi

          PROJ_ROOT=""
          if [ -f "extracted_dir/pubspec.yaml" ]; then
            PROJ_ROOT="extracted_dir"
          else
            FOUND_PUBSPEC="$(find extracted_dir -maxdepth 5 -name 'pubspec.yaml' -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_PUBSPEC" ]; then
              PROJ_ROOT="$(dirname "$FOUND_PUBSPEC")"
            elif [ -f "pubspec.yaml" ]; then
              PROJ_ROOT="."
            fi
          fi

          echo "Detected PROJ_ROOT=$PROJ_ROOT"
          if [ -z "$PROJ_ROOT" ] || [ ! -f "$PROJ_ROOT/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found for KeyLink."
            exit 1
          fi

          flutter create keylink_app --org com.baraa.keylink --project-name keylink

          if [ -d "$PROJ_ROOT/lib" ]; then
            rm -rf keylink_app/lib/*
            cp -r "$PROJ_ROOT/lib"/. keylink_app/lib/
          fi

          if [ -d "$PROJ_ROOT/assets" ]; then
            mkdir -p keylink_app/assets
            cp -r "$PROJ_ROOT/assets"/. keylink_app/assets/
          fi

          cp "$PROJ_ROOT/pubspec.yaml" keylink_app/pubspec.yaml

          if [ -f "$PROJ_ROOT/analysis_options.yaml" ]; then
            cp "$PROJ_ROOT/analysis_options.yaml" keylink_app/analysis_options.yaml
          fi

          if [ -d "$PROJ_ROOT/android/app/src" ]; then
            rm -rf keylink_app/android/app/src
            mkdir -p keylink_app/android/app/src
            cp -r "$PROJ_ROOT/android/app/src"/. keylink_app/android/app/src/
          fi

          if [ -f "$PROJ_ROOT/android/app/build.gradle" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle" keylink_app/android/app/build.gradle
          fi

          if [ -f "$PROJ_ROOT/android/app/build.gradle.kts" ]; then
            cp "$PROJ_ROOT/android/app/build.gradle.kts" keylink_app/android/app/build.gradle.kts
          fi

          echo "=== Verified keylink_app/lib files ==="
          find keylink_app/lib -type f | sort
          echo "=== Verified keylink_app/android/app/src files ==="
          find keylink_app/android/app/src -type f 2>/dev/null | sort || true

      - name: Build release APK
        working-directory: keylink_app
        run: |
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          for dart_file in Path("lib").rglob("*.dart"):
              txt = dart_file.read_text(encoding="utf-8", errors="ignore")
              updated = re.sub(
                  r"\bisArabic\s*:\s*(_isArabic|isAr|isArabic)\b",
                  r"language: (\1 ? 'ar' : 'en')",
                  txt,
              )
              if dart_file.name == "main.dart":
                  updated = re.sub(r"\bprofiles\s*:\s*_profiles\s*,?\s*", "", updated)
              if dart_file.name == "home_screen.dart":
                  updated = re.sub(
                      r"(\bHowToUseScreen\s*\(\s*language\s*:\s*[^,)]+?)(\s*\))",
                      r"\1, onLanguageChanged: (_) {}\2",
                      updated,
                  )
              if updated != txt:
                  dart_file.write_text(updated, encoding="utf-8")
          PY

          flutter pub get

          for attempt in 1 2 3; do
            echo "Building release APK (attempt $attempt/3)..."
            if flutter build apk --release; then
              echo "APK build succeeded!"
              exit 0
            fi
            echo "Build attempt $attempt failed, waiting 15s before retry..."
            sleep 15
          done
          exit 1

      - name: Upload KeyLink APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keylink-apk
          path: keylink_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

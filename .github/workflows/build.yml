name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
      - run: |
          mkdir -p extracted_dir flutter_app
          ZIP_FILE=$(find . -maxdepth 2 -name "*muezzin*.zip" -o -name "*.zip" | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE"
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted_dir
          fi
          flutter create flutter_app --org com.braa.muezzin --project-name muezzin
          LIB_SOURCE=$(find . -maxdepth 5 -not -path "./flutter_app*" -not -path "./.github*" -type d -name "lib" -print | head -n 1)
          echo "LIB_SOURCE=$LIB_SOURCE"
          if [ -n "$LIB_SOURCE" ]; then
            rm -rf flutter_app/lib/*
            cp -r "$LIB_SOURCE"/* flutter_app/lib/
          else
            echo "ERROR: lib folder not found in repository or zip!"
            exit 1
          fi
          PUBSPEC_SOURCE=$(find . -maxdepth 5 -not -path "./flutter_app*" -not -path "./.github*" -type f -name "pubspec.yaml" -print | head -n 1)
          echo "PUBSPEC_SOURCE=$PUBSPEC_SOURCE"
          if [ -n "$PUBSPEC_SOURCE" ]; then
            cp "$PUBSPEC_SOURCE" flutter_app/pubspec.yaml
          fi
          cd flutter_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: muezzin-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

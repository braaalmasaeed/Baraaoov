APK

on:
  push:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted_dir
          unzip -o muezzin_project.zip -d extracted_dir

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Prepare Flutter Project
        run: |
          mkdir -p flutter_app
          flutter create flutter_app --org com.braa.muezzin --project-name muezzin
          if [ -d "extracted_dir/lib" ]; then
            cp -r extracted_dir/lib/* flutter_app/lib/
          fi
          if [ ! -f "flutter_app/lib/main.dart" ]; then
            printf 'import "package:flutter/material.dart";\nimport "screens/home_screen.dart";\nvoid main() { runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: HomeScreen())); }\n' > flutter_app/lib/main.dart
          fi
          cd flutter_app/android
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:/services.gradle.org/distributions/gradle-8.7-all.zip/' gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

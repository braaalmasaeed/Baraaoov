name: Build CoreLink APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android v2 embedding and build APK
        run: |
          set -e
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i -E 's/(name=["'\'']flutterEmbedding["'\''][^>]*value=["'\''])1(["'\''])/\12\2/g' "$MANIFEST"
            if ! grep -q "flutterEmbedding" "$MANIFEST"; then
              sed -i 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$MANIFEST"
            fi
          fi

          for kt_file in $(find android/app/src/main -name "*.kt" 2>/dev/null); do
            if grep -q "io\.flutter\.app\." "$kt_file" || ! grep -q "io\.flutter\.embedding\.android\." "$kt_file"; then
              if grep -q "class MainActivity" "$kt_file"; then
                PKG=$(grep -E "^[[:space:]]*package[[:space:]]+" "$kt_file" | head -n 1 | sed -E 's/^[[:space:]]*package[[:space:]]+([^ ;/]+).*/\1/')
                [ -z "$PKG" ] && PKG="com.example.core_link"
                printf 'package %s\n\nimport io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\n\nclass MainActivity : FlutterActivity() {\n    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n        super.configureFlutterEngine(flutterEngine)\n    }\n}\n' "$PKG" > "$kt_file"
              fi
            fi
          done

          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk

name: Build CoreLink APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip CoreLink
        run: |
          mkdir -p app_src
          unzip -q CoreLink.zip -d app_src
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Ensure Android v2 Embedding & Build APK
        run: |
          PROJECT_DIR=$(find app_src -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "flutterEmbedding" "$MANIFEST"; then
            python3 - <<'EOF'
from pathlib import Path
p = Path("android/app/src/main/AndroidManifest.xml")
text = p.read_text(encoding="utf-8")
meta = '        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />\n'
if "</application>" in text:
    text = text.replace("</application>", meta + "    </application>", 1)
    p.write_text(text, encoding="utf-8")
EOF
          fi
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreLink-APK
          path: app_src/**/build/app/outputs/flutter-apk/*.apk
 
